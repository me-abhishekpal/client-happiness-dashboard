# Local Development: starts only PostgreSQL
# The Next.js app runs natively via `npm run dev`
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d    # Start Postgres
#   docker compose -f docker-compose.dev.yml down     # Stop Postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: client-happiness-db-dev
    restart: unless-stopped
    ports:
      - "5432:5432" # Exposed to localhost for dev tools (TablePlus, psql, etc.)
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
