name: CI — Dev Environment

# Triggered on push to the `dev` branch
# Builds Docker image, pushes to GHCR with :dev tag,
# then SSHs into dev server to pull and restart.

on:
  push:
    branches:
      - dev

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # me-abhishekpal/client-happiness-dashboard

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Always tag as :dev
            type=raw,value=dev
            # Also tag with short SHA for rollback: dev-sha-XXXXXXX
            type=sha,prefix=dev-sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployment/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    name: Deploy to Dev Server
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: development

    steps:
      - name: Deploy to dev server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            set -e
            cd ~/client-happiness

            # Login to GHCR on the server
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the latest dev image
            export IMAGE_TAG=dev
            docker compose -f deployment/docker-compose.yml pull app

            # Restart with zero-downtime (recreate only the app service)
            docker compose -f deployment/docker-compose.yml up -d --no-deps app

            echo "✅ Dev deployment complete! Running containers:"
            docker ps --filter "name=client-happiness" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"

      - name: Verify dev health
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            sleep 15
            curl -f http://localhost:3000/api/health || (echo "❌ Health check failed!" && exit 1)
            echo "✅ Dev health check passed!"
